<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Poolrooms</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #04070a; }
  body { -webkit-font-smoothing: antialiased; }
  #view { display: block; width: 100vw; height: 100vh; }

  /* 唯一的 DOM 覆盖层：进入前的黑幕与提示；进入后全部淡出，画面上不留任何控件 */
  #veil {
    position: fixed; inset: 0; background: #04070a; pointer-events: none;
    transition: opacity 2.6s ease-out; opacity: 1; z-index: 10;
  }
  #veil.gone { opacity: 0; }

  #hint {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6em; cursor: pointer;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: rgba(236, 244, 248, 0.72); text-shadow: 0 1px 18px rgba(0, 0, 0, 0.6);
    transition: opacity 1.1s ease-out; opacity: 0;
  }
  #hint.show { opacity: 1; }
  #hint.hidden { opacity: 0; pointer-events: none; }
  #hint b { font-size: 17px; font-weight: 400; letter-spacing: 0.42em; text-indent: 0.42em; }
  #hint i { font-size: 12px; font-weight: 300; font-style: normal; letter-spacing: 0.16em;
            color: rgba(214, 230, 238, 0.42); }

  #fatal {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; padding: 8vh 12vw;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 2; color: rgba(230, 236, 240, 0.8);
    background: #04070a; white-space: pre-wrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="veil"></div>
  <div id="hint"><b>点击进入</b><i>WASD 移动 · SHIFT 快走 · SPACE 上浮 · CTRL 下潜 · ESC 释放鼠标</i></div>
  <div id="fatal"></div>
  <script type="module">
    // 顶层错误兜底：任何模块加载/运行期异常都落到 #fatal，绝不留白屏无提示
    const fatal = document.getElementById('fatal');
    function showFatal(msg) {
      fatal.textContent = String(msg);
      fatal.style.display = 'flex';
      document.getElementById('hint').classList.add('hidden');
    }
    window.addEventListener('error', (e) => showFatal('运行出错：\n' + (e.error?.stack || e.message)));
    window.addEventListener('unhandledrejection', (e) => showFatal('运行出错：\n' + (e.reason?.stack || e.reason)));
    import('./src/main.js').catch((err) => showFatal('加载失败：\n' + (err?.stack || err)));
  </script>
</body>
</html>
